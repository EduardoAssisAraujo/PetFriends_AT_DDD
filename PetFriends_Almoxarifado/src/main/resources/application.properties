spring.application.name=PetFriends_Almoxarifado

# Servidor
server.port=8081

# Banco de dados (Postgres via Docker Compose)
spring.datasource.url=jdbc:postgresql://localhost:5433/almoxarifado_db
spring.datasource.username=petfriends
spring.datasource.password=petfriends
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Carrega data.sql após o Hibernate criar/atualizar as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

